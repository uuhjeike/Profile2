<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08070b">
  <title>Alpha · Profiles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-red" aria-hidden="true"></div>
  <div class="ambient ambient-purple" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-space" aria-hidden="true"></div>
    <div class="search-area">
      <button class="search-toggle" id="search-toggle" type="button" aria-label="Open profile search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 4.2 4.2"></path></svg>
      </button>
      <label class="search-wrap" id="search-wrap" hidden>
        <input id="search" type="search" placeholder="Search profiles…" autocomplete="off" spellcheck="false" aria-label="Search profiles">
        <button id="clear-search" type="button" aria-label="Clear search" hidden>×</button>
      </label>
    </div>
  </header>
  <main class="main">
    <p class="status" id="status" aria-live="polite"></p>
    <span class="count" id="count" hidden></span>
    <section class="grid" id="profiles" aria-label="Profiles"></section>
    <div class="empty" id="empty" hidden><span class="empty-mark">⌕</span><p>No matching profiles</p></div>
    <div class="error" id="error" hidden><p>Profiles could not be loaded.</p><button id="retry" type="button">Retry</button></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
